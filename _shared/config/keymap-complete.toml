#:schema https://yazi-rs.github.io/schemas/keymap.json
# yazi-windows-rescue: complete tier keymap.
# Only universal, high-value additions. Personal jumps (e.g. a projects dir)
# are appended deterministically by scripts/apply-config.ps1.

[mgr]
prepend_keymap = [
    { on = ["g", "h"], run = "cd ~", desc = "Go home" },
    { on = "!", run = 'shell "pwsh" --block --confirm', desc = "Open PowerShell here" },
]
