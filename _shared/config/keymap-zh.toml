    { on = "~",         run = "help",             desc = "打开帮助" },
    { on = "<F1>",      run = "help",             desc = "打开帮助" },
]

[input]

prepend_keymap = [
    { on = "<C-c>",     run = "close",            desc = "取消输入" },
    { on = "<Enter>",   run = "close --submit",   desc = "提交输入" },
    { on = "<Esc>",     run = "escape",           desc = "返回普通模式 / 取消输入" },
    { on = "<C-[>",     run = "escape",           desc = "返回普通模式 / 取消输入" },

    # 模式切换
    { on = "i",         run = "insert",           desc = "进入插入模式" },
    { on = "I",         run = ["move first-char", "insert"], desc = "移到行首并进入插入模式" },
    { on = "a",         run = "insert --append",  desc = "进入追加模式" },
    { on = "A",         run = ["move eol", "insert --append"], desc = "移到行尾并进入追加模式" },
    { on = "v",         run = "visual",           desc = "进入可视模式" },
    { on = "r",         run = "replace",          desc = "替换一个字符" },

    # 选择
    { on = "V",         run = ["move bol", "visual", "move eol"], desc = "从行首选到行尾" },
    { on = "<C-a>",     run = ["move eol", "visual", "move bol"], desc = "从行尾选到行首" },
    { on = "<Home>",    run = ["move bol", "visual", "move eol"], desc = "从行首选到行尾" },

    # 字符移动
    { on = "h",         run = "move -1",          desc = "左移一个字符" },
    { on = "l",         run = "move 1",           desc = "右移一个字符" },
    { on = "<Left>",    run = "move -1",          desc = "左移一个字符" },
    { on = "<Right>",   run = "move 1",           desc = "右移一个字符" },
    { on = "<C-b>",     run = "move -1",          desc = "左移一个字符" },
    { on = "<C-f>",     run = "move 1",           desc = "右移一个字符" },

    # 词移动
    { on = "b",         run = "backward",         desc = "后退到上一个词首" },
    { on = "B",         run = "backward --far",   desc = "后退到上一个 WORD 首" },
    { on = "w",         run = "forward",          desc = "前进到下一个词首" },
    { on = "W",         run = "forward --far",    desc = "前进到下一个 WORD 首" },
    { on = "e",         run = "forward --end-of-word", desc = "前进到当前 / 下一个词尾" },
    { on = "E",         run = "forward --far --end-of-word", desc = "前进到当前 / 下一个 WORD 尾" },
    { on = "<C-Left>",  run = "backward",          desc = "后退到上一个词首" },
    { on = "<C-Right>", run = "forward --end-of-word", desc = "前进到下一个词尾" },
    { on = "<A-b>",     run = "backward",          desc = "后退到上一个词首" },
    { on = "<A-f>",     run = "forward --end-of-word", desc = "前进到下一个词尾" },

    # 行移动
    { on = "0",         run = "move bol",         desc = "移到行首" },
    { on = "$",         run = "move eol",         desc = "移到行尾" },
    { on = "_",         run = "move first-char",  desc = "移到行首非空字符" },
    { on = "^",         run = "move first-char",  desc = "移到行首非空字符" },
    { on = "<Home>",    run = "move bol",         desc = "移到行首" },
    { on = "<End>",     run = "move eol",         desc = "移到行尾" },
    { on = "<C-a>",     run = "move bol",         desc = "移到行首" },
    { on = "<C-e>",     run = "move eol",         desc = "移到行尾" },

    # 删除
    { on = "<Backspace>",run = "backspace",        desc = "删除光标前一个字符" },
    { on = "<Delete>",  run = "backspace --under", desc = "删除光标下字符" },
    { on = "<C-h>",     run = "backspace",        desc = "删除光标前一个字符" },
    { on = "<C-d>",     run = "backspace --under", desc = "删除光标下字符" },

    # Kill
    { on = "<C-u>",     run = "kill bol",         desc = "删除到行首" },
    { on = "<C-k>",     run = "kill eol",         desc = "删除到行尾" },
    { on = "<C-w>",     run = "kill backward",    desc = "删除到上一个词首" },
    { on = "<A-d>",     run = "kill forward",     desc = "删除到下一个词尾" },
    { on = "<A-BS>",    run = "kill backward",    desc = "删除到上一个词首" },

    # 剪切 / 复制 / 粘贴
    { on = "d",         run = "delete --cut",     desc = "剪切选中字符" },
    { on = "D",         run = ["delete --cut", "move eol"], desc = "剪切到行尾" },
    { on = "c",         run = "delete --cut --insert", desc = "剪切并进入插入模式" },
    { on = "C",         run = ["delete --cut --insert", "move eol"], desc = "剪切到行尾并进入插入模式" },
    { on = "s",         run = ["delete --cut --insert", "move 1"], desc = "剪切当前字符并进入插入模式" },
    { on = "S",         run = ["move bol", "delete --cut --insert", "move eol"], desc = "剪切整行并进入插入模式" },
    { on = "x",         run = ["delete --cut", "move 1 --in-operating"], desc = "剪切当前字符" },
    { on = "y",         run = "yank",             desc = "复制选中字符" },
    { on = "p",         run = "paste",            desc = "在光标后粘贴" },
    { on = "P",         run = "paste --before",   desc = "在光标前粘贴" },

    # 撤销 / 重做
    { on = "u",         run = ["undo", "casefy lower"], desc = "撤销（可视模式下转小写）" },
    { on = "U",         run = "casefy upper",     desc = "转大写" },
    { on = "<C-r>",     run = "redo",             desc = "重做" },

    # 帮助
    { on = "~",         run = "help",             desc = "打开帮助" },
    { on = "<F1>",      run = "help",             desc = "打开帮助" },
]

