#:schema https://yazi-rs.github.io/schemas/yazi.json
# yazi-windows-rescue: complete tier config.
# Still deliberately small - yazi's defaults do the heavy lifting.
# NOTE for the config skill: the markdown previewer block is APPENDED at the
# end by /yazi-config ONLY after both the piper plugin and glow are confirmed
# installed. Never pre-write it here.

[mgr]
ratio          = [ 1, 3, 4 ]
sort_dir_first = true
linemode       = "size"
show_hidden    = false

[preview]
image_delay = 30

[opener]
edit = [
    # Default safe editor. scripts/apply-config.ps1 rewrites this section
    # deterministically for VS Code / Neovim while keeping Notepad fallback.
    { run = 'notepad %s', desc = "Notepad", for = "windows", orphan = true },
]
